[project]
name = "jlens-cuda"
version = "0.1.0"
description = "Jacobian lens / J-space visualizer for Qwen3.8-27B (bf16) on CUDA — a port of WeZZard/jlens-qwen36"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "torch>=2.7",
    "transformers>=5.8",
    "accelerate>=1.0",
    "numpy>=2.0",
    "safetensors>=0.4",
    "datasets>=2.20",
    "huggingface-hub>=0.25",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    # Anthropic's reference Jacobian-lens implementation (fitting estimator).
    "jlens @ git+https://github.com/anthropics/jacobian-lens@581d398613e5602a5af361e1c34d3a92ea82ba8e",
    # Triton kernels (with backward) for the 48 Gated DeltaNet layers.
    "flash-linear-attention[cuda]>=0.5 ; sys_platform == 'linux'",
    # Hopper GDN backward is incorrect with torch 2.11's Triton 3.6.0.
    # FLA dispatches the affected op to TileLang; a host nvcc is also required.
    "tilelang>=0.1.15,<0.2 ; sys_platform == 'linux'",
]

[project.optional-dependencies]
# CUDA causal-conv1d kernel (compiles against your CUDA toolkit; optional —
# the torch fallback for the depthwise conv is cheap).
conv1d = ["causal-conv1d>=1.4"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jlens_qwen"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# The target HPC H200 nodes expose CUDA driver API 12.8. PyPI torch
# 2.14 ships CUDA 13, so use the official cu128 build on Linux.
constraint-dependencies = ["torch==2.11.0 ; sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
